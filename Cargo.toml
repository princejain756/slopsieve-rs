[package]
name = "slopsieve"
version = "0.1.0"
edition = "2021"
description = "Score a diff or PR for AI-slop review signals: test weakening, secret leaks, phantom imports, debug leftovers, trivial deps, dead exports"
license = "MIT"
repository = "https://github.com/princejain756/slopsieve-rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
